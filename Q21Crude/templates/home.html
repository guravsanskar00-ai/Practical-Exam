<!DOCTYPE html>
<html>
<head>
    <title>Student CRUD</title>
</head>
<body>

<h1>Student Management System</h1>

<a href="/add">Add Student</a>

<br><br>

<table border="1">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Age</th>
    <th>Course</th>
    <th>Action</th>
</tr>

{% for student in students %}

<tr>
    <td>{{ student['id'] }}</td>
    <td>{{ student['name'] }}</td>
    <td>{{ student['age'] }}</td>
    <td>{{ student['course'] }}</td>

    <td>
        <a href="/update/{{ student['id'] }}">Update</a>
        |
        <a href="/delete/{{ student['id'] }}">Delete</a>
    </td>
</tr>

{% endfor %}

</table>

</body>
</html>
